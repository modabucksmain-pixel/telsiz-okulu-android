<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Temel Devre Elemanları</title>
  <desc>Direnç, Kondansatör, Bobin ve Diyot devre şeması sembolleri</desc>

  <rect x="0" y="0" width="680" height="320" rx="16" fill="#1E293B"/>

  <text x="340" y="36" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Temel Devre Elemanları</text>

  <!-- Direnç -->
  <rect x="20" y="56" width="155" height="200" rx="10" fill="#0F172A" stroke="#334155" stroke-width="0.5"/>
  <text x="98" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#3B82F6">Direnç</text>
  <line x1="30" y1="130" x2="52" y2="130" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="52,130 58,113 67,147 76,113 85,147 94,113 103,147 110,130" fill="none" stroke="#F8FAFC" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="110" y1="130" x2="160" y2="130" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
  <text x="98" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748B">Ω (Ohm)</text>
  <text x="98" y="178" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Akım akışını kısıtlar</text>
  <text x="98" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">R = V / I</text>
  <text x="98" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">IEEE: zigzag çizgi</text>
  <text x="98" y="238" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">IEC: dikdörtgen kutu</text>

  <!-- Kondansatör -->
  <rect x="185" y="56" width="155" height="200" rx="10" fill="#0F172A" stroke="#334155" stroke-width="0.5"/>
  <text x="263" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#22C55E">Kondansatör</text>
  <line x1="195" y1="130" x2="238" y2="130" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="238" y1="113" x2="238" y2="147" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="250" y1="113" x2="250" y2="147" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="250" y1="130" x2="325" y2="130" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
  <text x="263" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748B">F (Farad)</text>
  <text x="263" y="178" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Enerji depolar (elektrik)</text>
  <text x="263" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">XC = 1 / (2πfC)</text>
  <text x="263" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">DC → geçirmez</text>
  <text x="263" y="238" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">AC → geçirir</text>

  <!-- Bobin -->
  <rect x="350" y="56" width="155" height="200" rx="10" fill="#0F172A" stroke="#334155" stroke-width="0.5"/>
  <text x="428" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#F59E0B">Bobin (İndüktör)</text>
  <line x1="360" y1="130" x2="376" y2="130" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M376,130 A9,9 0 0,1 394,130" fill="none" stroke="#F8FAFC" stroke-width="1.5"/>
  <path d="M394,130 A9,9 0 0,1 412,130" fill="none" stroke="#F8FAFC" stroke-width="1.5"/>
  <path d="M412,130 A9,9 0 0,1 430,130" fill="none" stroke="#F8FAFC" stroke-width="1.5"/>
  <path d="M430,130 A9,9 0 0,1 448,130" fill="none" stroke="#F8FAFC" stroke-width="1.5"/>
  <line x1="448" y1="130" x2="490" y2="130" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
  <text x="428" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748B">H (Henry)</text>
  <text x="428" y="178" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Enerji depolar (manyetik)</text>
  <text x="428" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">XL = 2πfL</text>
  <text x="428" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">DC → geçirir</text>
  <text x="428" y="238" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">AC → kısıtlar</text>

  <!-- Diyot -->
  <rect x="515" y="56" width="150" height="200" rx="10" fill="#0F172A" stroke="#334155" stroke-width="0.5"/>
  <text x="590" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#F43F5E">Diyot</text>
  <line x1="525" y1="130" x2="548" y2="130" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="548,114 548,146 572,130" fill="#F8FAFC" stroke="#F8FAFC" stroke-width="0.5" stroke-linejoin="round"/>
  <line x1="572" y1="114" x2="572" y2="146" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round"/>
  <line x1="572" y1="130" x2="650" y2="130" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
  <text x="548" y="160" font-family="sans-serif" font-size="9" fill="#64748B">Anot (+)</text>
  <text x="580" y="160" font-family="sans-serif" font-size="9" fill="#64748B">Katot (-)</text>
  <text x="590" y="178" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Tek yön akım iletimi</text>
  <text x="590" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">İleri → Vd ≈ 0.7V</text>
  <text x="590" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">Geri → bloke eder</text>
  <text x="590" y="238" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">Doğrultucu, koruyucu</text>

  <!-- Alt açıklama -->
  <text x="340" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">IEEE / IEC standart devre şeması sembolleri — RF filtre devrelerinde L-C kombinasyonu kullanılır</text>
</svg>
