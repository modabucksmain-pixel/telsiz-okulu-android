<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Dalga Boyu ve Frekans</title>
  <desc>Sinyal dalgası, genlik, dalga boyu ve frekans gösterimi</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="340" rx="16" fill="#1E293B"/>

  <text x="340" y="36" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Dalga Boyu (λ) ve Frekans (f)</text>

  <!-- Eksenler -->
  <line x1="55" y1="180" x2="635" y2="180" stroke="#334155" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="65" y1="300" x2="65" y2="55" stroke="#334155" stroke-width="1" marker-end="url(#arr)"/>
  <text x="638" y="184" font-family="sans-serif" font-size="11" fill="#64748B">t</text>
  <text x="68" y="55" font-family="sans-serif" font-size="11" fill="#64748B">A</text>

  <!-- Düşük frekanslı dalga (mavi) -->
  <path d="M65,180 Q130,90 195,180 Q260,270 325,180 Q390,90 455,180 Q520,270 585,180 Q625,110 635,95" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>

  <!-- Genlik dashed çizgiler -->
  <line x1="130" y1="90" x2="130" y2="180" stroke="#3B82F6" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.7"/>
  <line x1="260" y1="270" x2="260" y2="180" stroke="#3B82F6" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.7"/>

  <!-- Genlik etiketleri -->
  <line x1="55" y1="90" x2="130" y2="90" stroke="#3B82F6" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5"/>
  <text x="50" y="94" text-anchor="end" font-family="sans-serif" font-size="11" fill="#60A5FA">+A</text>
  <line x1="55" y1="270" x2="260" y2="270" stroke="#3B82F6" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5"/>
  <text x="50" y="274" text-anchor="end" font-family="sans-serif" font-size="11" fill="#60A5FA">-A</text>

  <!-- Dalga boyu işaretleyici -->
  <line x1="65" y1="300" x2="325" y2="300" stroke="#22C55E" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="195" y="316" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#22C55E">λ (dalga boyu)</text>

  <!-- Yüksek frekanslı dalga (kırmızı, dashed) -->
  <path d="M65,180 Q97,127 129,180 Q161,233 193,180 Q225,127 257,180 Q289,233 321,180 Q353,127 385,180 Q417,233 449,180 Q481,127 513,180 Q545,233 577,180 Q609,127 635,155" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-linecap="round" opacity="0.6" stroke-dasharray="6 3"/>

  <!-- Açıklama kutusu -->
  <rect x="430" y="80" width="190" height="80" rx="8" fill="#0F172A" stroke="#334155" stroke-width="0.5"/>
  <rect x="438" y="90" width="8" height="8" rx="2" fill="#3B82F6"/>
  <text x="452" y="99" font-family="sans-serif" font-size="11" fill="#F8FAFC">Düşük f → Uzun λ</text>
  <text x="452" y="114" font-family="sans-serif" font-size="10" fill="#64748B">HF / VHF bandları</text>
  <rect x="438" y="124" width="8" height="8" rx="2" fill="#F43F5E"/>
  <text x="452" y="133" font-family="sans-serif" font-size="11" fill="#F8FAFC">Yüksek f → Kısa λ</text>
  <text x="452" y="148" font-family="sans-serif" font-size="10" fill="#64748B">UHF / SHF bandları</text>

  <!-- Formül bandı -->
  <rect x="90" y="322" width="500" height="14" rx="4" fill="#0F172A" opacity="0.7"/>
  <text x="340" y="332" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F8FAFC">λ = c / f   →   c = 300.000 km/s   →   f = c / λ</text>
</svg>
