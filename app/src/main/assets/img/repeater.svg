<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Röle İstasyonu (Repeater) Çalışma Mantığı</title>
  <desc>Telsiz rölesinin VHF/UHF sinyallerini alıp güçlendirerek yeniden göndermesini gösteren Türkçe şema</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect x="0" y="0" width="680" height="400" rx="16" fill="#1E293B"/>

  <!-- Başlık -->
  <text x="340" y="34" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Röle (Repeater) Çalışma Mantığı</text>
  <text x="340" y="52" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">VHF/UHF Coğrafi Görüş Engellerini Aşma Tekniği</text>

  <!-- Dağ (Coğrafi Engel) -->
  <path d="M220,400 L340,160 L460,400 Z" fill="url(#mountainGrad)" stroke="#475569" stroke-width="1"/>
  <text x="340" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#64748B">Dağ / Engel</text>

  <!-- Tepedeki Röle İstasyonu -->
  <!-- Kule -->
  <line x1="340" y1="160" x2="340" y2="90" stroke="#EF4444" stroke-width="2.5"/>
  <line x1="330" y1="160" x2="340" y2="90" stroke="#EF4444" stroke-width="1.5"/>
  <line x1="350" y1="160" x2="340" y2="90" stroke="#EF4444" stroke-width="1.5"/>
  <!-- Çapraz bağlar -->
  <line x1="335" y1="125" x2="345" y2="125" stroke="#EF4444" stroke-width="1"/>
  <line x1="332" y1="145" x2="348" y2="145" stroke="#EF4444" stroke-width="1"/>
  <!-- Antenler -->
  <line x1="335" y1="90" x2="335" y2="70" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="335" cy="70" r="2" fill="#3B82F6"/>
  <text x="325" y="80" text-anchor="end" font-family="sans-serif" font-size="9" fill="#3B82F6">Alıcı Anten</text>

  <line x1="345" y1="90" x2="345" y2="70" stroke="#10B981" stroke-width="2"/>
  <circle cx="345" cy="70" r="2" fill="#10B981"/>
  <text x="355" y="80" text-anchor="start" font-family="sans-serif" font-size="9" fill="#10B981">Verici Anten</text>

  <!-- Röle Etiketi -->
  <rect x="290" y="175" width="100" height="32" rx="4" fill="#0F172A" stroke="#EF4444" stroke-width="0.8"/>
  <text x="340" y="189" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#F8FAFC">RÖLE İSTASYONU</text>
  <text x="340" y="201" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#FCA5A5">Frekans Kayması (Offset)</text>

  <!-- Sol İstasyon (A Operatörü) -->
  <g transform="translate(60, 290)">
    <!-- El telsizi şematik -->
    <rect x="0" y="20" width="36" height="60" rx="4" fill="#0B1120" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="6" y="28" width="24" height="16" rx="2" fill="#1E293B"/>
    <line x1="12" y1="10" x2="12" y2="20" stroke="#475569" stroke-width="3"/>
    <text x="18" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Operatör A</text>
    <text x="18" y="106" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94A3B8">(Vadi içi / İstanbul)</text>
  </g>

  <!-- Sağ İstasyon (B Operatörü) -->
  <g transform="translate(560, 290)">
    <!-- El telsizi şematik -->
    <rect x="0" y="20" width="36" height="60" rx="4" fill="#0B1120" stroke="#10B981" stroke-width="1.5"/>
    <rect x="6" y="28" width="24" height="16" rx="2" fill="#1E293B"/>
    <line x1="12" y1="10" x2="12" y2="20" stroke="#475569" stroke-width="3"/>
    <text x="18" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Operatör B</text>
    <text x="18" y="106" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94A3B8">(Yamaç dışı / Kocaeli)</text>
  </g>

  <!-- Direkt Görüş Yok (Engel Engellemesi) -->
  <line x1="110" y1="310" x2="560" y2="310" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="290" y="302" width="100" height="16" rx="4" fill="#7F1D1D"/>
  <text x="340" y="314" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#FCA5A5">Direkt Görüş Engelli ❌</text>

  <!-- Sinyal İletimleri (Röle Üzerinden) -->
  <!-- A'dan Röle'ye Giriş (TX) -->
  <path d="M80,290 Q205,170 330,85" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="110" y="170" width="125" height="28" rx="4" fill="#0F172A" stroke="#3B82F6" stroke-width="0.5"/>
  <text x="172" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#60A5FA">Röle Giriş (A'dan TX):</text>
  <text x="172" y="193" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#F8FAFC">145.000 MHz</text>

  <!-- Röle'den B'ye Çıkış (RX) -->
  <path d="M350,85 Q465,170 580,290" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="430" y="170" width="125" height="28" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="0.5"/>
  <text x="492" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#34D399">Röle Çıkış (B'den RX):</text>
  <text x="492" y="193" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#F8FAFC">145.600 MHz</text>

  <!-- Bilgi bandı -->
  <rect x="40" y="220" width="180" height="60" rx="6" fill="#0F172A" stroke="#475569" stroke-width="0.5"/>
  <text x="50" y="236" font-family="sans-serif" font-size="9" font-weight="700" fill="#EF4444">⚠️ Röle Ofset (Shift):</text>
  <text x="50" y="248" font-family="sans-serif" font-size="8" fill="#94A3B8">VHF bandında Türkiye offseti</text>
  <text x="50" y="259" font-family="sans-serif" font-size="8" fill="#94A3B8">-600 kHz'dir (0.6 MHz).</text>
  <text x="50" y="271" font-family="sans-serif" font-size="8" fill="#F8FAFC">Giriş: 145.000 / Çıkış: 145.600</text>
</svg>
