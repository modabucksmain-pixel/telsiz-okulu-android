<svg width="100%" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>İyonosferik Gök Dalgası Yayılımı</title>
  <desc>HF sinyallerinin iyonosfer tabakasından yansımasını gösteren Türkçe şema</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect x="0" y="0" width="680" height="380" rx="16" fill="#1E293B"/>

  <!-- Başlık -->
  <text x="340" y="36" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#94A3B8">HF Gök Dalgası (Skywave) Yayılımı</text>

  <!-- İyonosfer Tabakası -->
  <rect x="40" y="70" width="600" height="60" rx="8" fill="url(#skyGrad)" stroke="#8B5CF6" stroke-width="1"/>
  <text x="340" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#F3E8FF">İ Y O N O S F E R   T A B A K A S I</text>
  <text x="340" y="116" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#DDD6FE">(Yerden 80 - 600 km yükseklikte elektrik yüklü tabaka)</text>

  <!-- Yeryüzü (Kavisli Dünya Yüzeyi) -->
  <path d="M40,320 Q340,280 640,320 L640,360 L40,360 Z" fill="url(#earthGrad)" stroke="#3B82F6" stroke-width="1"/>
  <text x="340" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#93C5FD">Y E R Y Ü Z Ü</text>

  <!-- Verici İstasyon (TX) -->
  <!-- Anten Kulesi -->
  <line x1="120" y1="298" x2="120" y2="240" stroke="#EF4444" stroke-width="2"/>
  <polygon points="120,240 110,255 130,255" fill="none" stroke="#EF4444" stroke-width="1.5"/>
  <polygon points="120,265 113,280 127,280" fill="none" stroke="#EF4444" stroke-width="1.5"/>
  <circle cx="120" cy="240" r="4" fill="#EF4444"/>
  <text x="120" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Verici (TX)</text>

  <!-- Alıcı İstasyon (RX) -->
  <line x1="560" y1="298" x2="560" y2="240" stroke="#10B981" stroke-width="2"/>
  <polygon points="560,240 550,255 570,255" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <polygon points="560,265 553,280 567,280" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="560" cy="240" r="4" fill="#10B981"/>
  <text x="560" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Alıcı (RX)</text>

  <!-- Sinyal Yolları -->
  <!-- 1. Gök Dalgası (Gökyüzüne gidip yansıyan) -->
  <!-- Çıkış dalgası -->
  <path d="M120,240 Q230,140 340,110" fill="none" stroke="#3B82F6" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="1 1"/>
  <path d="M340,110 Q450,140 560,240" fill="none" stroke="#60A5FA" stroke-width="3" marker-end="url(#arr)"/>
  <text x="200" y="160" transform="rotate(-22, 200, 160)" font-family="sans-serif" font-size="11" font-weight="700" fill="#60A5FA">Yayın (Gök Dalgası)</text>
  <text x="470" y="160" transform="rotate(22, 470, 160)" font-family="sans-serif" font-size="11" font-weight="700" fill="#34D399">Yansıyan Sinyal</text>

  <!-- 2. Yer Dalgası (Zemini takip eden) -->
  <path d="M120,250 Q340,230 560,250" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="340" y="224" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#F59E0B">Yer Dalgası (Groundwave)</text>
  <text x="340" y="238" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#FCD34D">(Sadece kısa mesafelerde etkilidir)</text>

  <!-- Atlama Mesafesi (Skip Distance) -->
  <line x1="120" y1="358" x2="560" y2="358" stroke="#A7F3D0" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="250" y="350" width="180" height="16" rx="4" fill="#0F172A"/>
  <text x="340" y="362" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#10B981">Atlama Mesafesi (Skip Distance)</text>

  <!-- Bilgi bandı -->
  <rect x="40" y="145" width="220" height="50" rx="6" fill="#0F172A" stroke="#475569" stroke-width="0.5"/>
  <text x="50" y="162" font-family="sans-serif" font-size="10" fill="#F8FAFC">⚡ İyonosferik Yansıma:</text>
  <text x="50" y="176" font-family="sans-serif" font-size="9" fill="#94A3B8">3-30 MHz (HF) Kısa dalga sinyallerinin</text>
  <text x="50" y="188" font-family="sans-serif" font-size="9" fill="#94A3B8">kıtalararası yayılmasını sağlar.</text>
</svg>
