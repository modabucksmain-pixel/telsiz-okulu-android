<svg width="100%" viewBox="0 0 680 440" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Anten Tipleri — Yagi ve Dipol</title>
  <desc>Yagi-Uda ve Dipol anten vektörel çizimi</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="440" rx="16" fill="#1E293B"/>

  <!-- Başlıklar -->
  <text x="170" y="36" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#3B82F6">Yagi-Uda Anten</text>
  <text x="510" y="36" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#22C55E">Dipol Anten</text>

  <!-- Dikey ayırıcı -->
  <line x1="340" y1="48" x2="340" y2="410" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- ======== YAGİ ANTEN ======== -->
  <!-- Boom çubuğu -->
  <rect x="52" y="188" width="250" height="5" rx="2" fill="#334155"/>

  <!-- Reflektör (en uzun, arka) -->
  <rect x="75" y="130" width="5" height="130" rx="2" fill="#F59E0B" opacity="0.9"/>
  <text x="78" y="122" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#F59E0B">Ref.</text>

  <!-- Radyatör (driven element) -->
  <rect x="140" y="118" width="5" height="155" rx="2" fill="#22C55E"/>
  <text x="143" y="110" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#22C55E">Radyatör</text>
  <circle cx="143" cy="190" r="5" fill="#22C55E" opacity="0.8"/>
  <line x1="143" y1="195" x2="143" y2="222" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="143" y="232" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#22C55E">Besleme</text>

  <!-- Direktörler -->
  <rect x="195" y="136" width="5" height="118" rx="2" fill="#60A5FA" opacity="0.9"/>
  <text x="198" y="128" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#60A5FA">D1</text>

  <rect x="230" y="142" width="5" height="106" rx="2" fill="#60A5FA" opacity="0.8"/>
  <text x="233" y="134" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#60A5FA">D2</text>

  <rect x="262" y="148" width="5" height="94" rx="2" fill="#60A5FA" opacity="0.7"/>
  <text x="265" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#60A5FA">D3</text>

  <!-- Yön oku -->
  <line x1="280" y1="190" x2="318" y2="190" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4 2"/>
  <text x="316" y="184" font-family="sans-serif" font-size="9" fill="#3B82F6">Yön</text>

  <!-- Yagi açıklama -->
  <rect x="40" y="260" width="270" height="110" rx="8" fill="#0F172A" stroke="#1E3A5F" stroke-width="0.5"/>
  <text x="175" y="282" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#3B82F6">Özellikler</text>
  <text x="175" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">Yüksek kazanç, yönlü radyasyon</text>
  <text x="175" y="316" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">Kazanç: 6–20 dBi</text>
  <text x="175" y="332" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">Kullanım: VHF/UHF, EME, DX</text>
  <text x="175" y="348" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">Reflektör arka → Direktörler ön</text>
  <text x="175" y="364" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">Eleman sayısı arttıkça kazanç artar</text>

  <!-- ======== DİPOL ANTEN ======== -->
  <!-- Dipol kolları -->
  <line x1="362" y1="190" x2="468" y2="190" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="480" y1="190" x2="640" y2="190" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Merkez boşluk / besleme noktası -->
  <rect x="466" y="178" width="16" height="24" rx="3" fill="#1E293B" stroke="#22C55E" stroke-width="1"/>
  <line x1="474" y1="202" x2="474" y2="240" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- λ/4 işaretleyiciler -->
  <line x1="362" y1="165" x2="466" y2="165" stroke="#3B82F6" stroke-width="0.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="414" y="159" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#60A5FA">λ/4</text>
  <line x1="480" y1="165" x2="640" y2="165" stroke="#3B82F6" stroke-width="0.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="560" y="159" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#60A5FA">λ/4</text>

  <!-- Toplam uzunluk işaretleyici -->
  <line x1="362" y1="148" x2="640" y2="148" stroke="#22C55E" stroke-width="0.6" marker-start="url(#arr)" marker-end="url(#arr)" opacity="0.5"/>
  <text x="501" y="142" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#22C55E" opacity="0.8">Toplam: λ/2</text>

  <!-- Radyasyon diyagramı -->
  <ellipse cx="474" cy="190" rx="32" ry="56" fill="none" stroke="#22C55E" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
  <ellipse cx="474" cy="190" rx="60" ry="22" fill="none" stroke="#22C55E" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="544" y="194" font-family="sans-serif" font-size="9" fill="#22C55E" opacity="0.7">radyasyon</text>

  <!-- Koaksiyel kablo -->
  <rect x="466" y="240" width="16" height="32" rx="3" fill="#0F172A" stroke="#334155" stroke-width="0.5"/>
  <text x="474" y="288" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">koaksiyel</text>

  <!-- Dipol açıklama -->
  <rect x="360" y="310" width="280" height="110" rx="8" fill="#0F172A" stroke="#14532D" stroke-width="0.5"/>
  <text x="500" y="332" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#22C55E">Özellikler</text>
  <text x="500" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">Omnidirectional (her yöne eşit)</text>
  <text x="500" y="366" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">Kazanç: 2.15 dBi</text>
  <text x="500" y="382" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">Kullanım: HF bant, genel amaçlı</text>
  <text x="500" y="398" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">Empedans: ~73 Ω (serbest uzayda)</text>
  <text x="500" y="414" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">Kurulumu basit, geniş bant uyumlu</text>
</svg>
