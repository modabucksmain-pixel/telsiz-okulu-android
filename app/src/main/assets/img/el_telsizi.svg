<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>El Telsizi (Handheld Transceiver)</title>
  <desc>PTT tuşu belirgin, ekran ve tuş takımlı el telsizi vektörü</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="500" rx="16" fill="#1E293B"/>
  <text x="340" y="34" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#94A3B8">El Telsizi (Handheld Transceiver)</text>

  <!-- Telsiz ana gövde -->
  <rect x="220" y="62" width="240" height="400" rx="18" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Anten -->
  <rect x="302" y="28" width="10" height="46" rx="4" fill="#475569"/>
  <rect x="300" y="68" width="14" height="6" rx="2" fill="#374151"/>
  <text x="307" y="22" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">SMA</text>

  <!-- Hoparlör ızgarası -->
  <rect x="238" y="78" width="204" height="36" rx="6" fill="#0B1120" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="252" y1="85" x2="428" y2="85" stroke="#334155" stroke-width="0.8"/>
  <line x1="252" y1="92" x2="428" y2="92" stroke="#334155" stroke-width="0.8"/>
  <line x1="252" y1="99" x2="428" y2="99" stroke="#334155" stroke-width="0.8"/>
  <line x1="252" y1="106" x2="428" y2="106" stroke="#334155" stroke-width="0.8"/>

  <!-- Ekran -->
  <rect x="238" y="124" width="204" height="72" rx="6" fill="#0B1120" stroke="#22C55E" stroke-width="1"/>
  <text x="340" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#22C55E">144.800 MHz</text>
  <text x="340" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4ADE80" opacity="0.8">FM  ·  25W  ·  SQ:3</text>
  <text x="340" y="187" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3B82F6" opacity="0.9">TA7K  ·  APRS ON</text>

  <!-- Tuş takımı 4x3 -->
  <!-- Satır 1 -->
  <rect x="238" y="210" width="56" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <text x="266" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">1</text>
  <rect x="302" y="210" width="56" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <text x="330" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">2</text>
  <rect x="366" y="210" width="56" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <text x="394" y="225" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">3</text>
  <!-- Satır 2 -->
  <rect x="238" y="240" width="56" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <text x="266" y="255" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">4</text>
  <rect x="302" y="240" width="56" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <text x="330" y="255" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">5</text>
  <rect x="366" y="240" width="56" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <text x="394" y="255" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">6</text>
  <!-- Satır 3 -->
  <rect x="238" y="270" width="56" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <text x="266" y="285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">7</text>
  <rect x="302" y="270" width="56" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <text x="330" y="285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">8</text>
  <rect x="366" y="270" width="56" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <text x="394" y="285" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">9</text>
  <!-- Satır 4 -->
  <rect x="238" y="300" width="56" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <text x="266" y="315" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">*</text>
  <rect x="302" y="300" width="56" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <text x="330" y="315" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">0</text>
  <rect x="366" y="300" width="56" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
  <text x="394" y="315" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">#</text>

  <!-- PTT TUŞU (sol kenar) -->
  <rect x="222" y="330" width="58" height="80" rx="10" fill="#1D4ED8" stroke="#3B82F6" stroke-width="2"/>
  <rect x="228" y="336" width="46" height="68" rx="8" fill="#1E40AF"/>
  <text x="251" y="364" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="500" fill="#BFDBFE">PTT</text>
  <text x="251" y="378" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#93C5FD">Push to</text>
  <text x="251" y="390" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#93C5FD">Talk</text>
  <text x="251" y="404" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#60A5FA">●</text>

  <!-- VOL tuşu (sağ kenar) -->
  <rect x="400" y="330" width="58" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
  <text x="429" y="352" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">VOL ▲▼</text>

  <!-- MON tuşu -->
  <rect x="400" y="374" width="58" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
  <text x="429" y="396" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">MON</text>

  <!-- Mikrofon ızgarası (alt) -->
  <rect x="238" y="422" width="204" height="8" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="252" y1="426" x2="428" y2="426" stroke="#334155" stroke-width="1"/>

  <!-- Pil göstergesi -->
  <rect x="238" y="436" width="204" height="14" rx="3" fill="#0B1120" stroke="#22C55E" stroke-width="0.5" opacity="0.6"/>
  <text x="340" y="447" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#22C55E" opacity="0.8">████████░░  LI-ION 2200mAh</text>

  <!-- ======== OKLU ETİKETLER ======== -->
  <!-- PTT etiketi -->
  <line x1="222" y1="370" x2="170" y2="370" stroke="#3B82F6" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="52" y="352" width="115" height="36" rx="6" fill="#1E3A5F" stroke="#3B82F6" stroke-width="0.8"/>
  <text x="110" y="368" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="500" fill="#93C5FD">PTT Tuşu</text>
  <text x="110" y="381" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#60A5FA">Basılı tut → TX</text>

  <!-- Ekran etiketi -->
  <line x1="442" y1="160" x2="490" y2="160" stroke="#22C55E" stroke-width="0.8" marker-end="url(#arr)"/>
  <text x="496" y="156" font-family="sans-serif" font-size="10" fill="#4ADE80">Ekran</text>
  <text x="496" y="170" font-family="sans-serif" font-size="9" fill="#64748B">frekans / mod</text>

  <!-- Anten etiketi -->
  <line x1="313" y1="28" x2="380" y2="20" stroke="#94A3B8" stroke-width="0.8" marker-end="url(#arr)"/>
  <text x="386" y="18" font-family="sans-serif" font-size="10" fill="#94A3B8">SMA Anten (5/8λ)</text>

  <!-- Hoparlör etiketi -->
  <line x1="442" y1="96" x2="490" y2="96" stroke="#64748B" stroke-width="0.8" marker-end="url(#arr)"/>
  <text x="496" y="100" font-family="sans-serif" font-size="10" fill="#64748B">Hoparlör</text>

  <!-- VOL etiketi -->
  <line x1="458" y1="348" x2="490" y2="348" stroke="#64748B" stroke-width="0.8" marker-end="url(#arr)"/>
  <text x="496" y="352" font-family="sans-serif" font-size="10" fill="#64748B">Ses / Squelch</text>

  <!-- Pil etiketi -->
  <line x1="340" y1="450" x2="340" y2="472" stroke="#22C55E" stroke-width="0.8" marker-end="url(#arr)"/>
  <text x="340" y="482" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#22C55E">Pil (LiPo / NiMH)</text>

  <!-- Alt bilgi bandı -->
  <text x="340" y="495" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">TX (Transmit) → Gönder  ·  RX (Receive) → Al  ·  Simplex / Duplex  ·  CTCSS / DCS Squelch</text>
</svg>
