<svg width="100%" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Ohm Kanunu Üçgeni</title>
  <desc>V, I, R üçgeni ve formülleri</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="380" rx="16" fill="#1E293B"/>

  <text x="340" y="38" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Ohm Kanunu Üçgeni</text>

  <polygon points="340,75 180,310 500,310" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="260" y1="193" x2="420" y2="193" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>

  <polygon points="340,77 261,193 419,193" fill="#1E3A5F" opacity="0.8"/>
  <text x="340" y="152" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="500" fill="#3B82F6">V</text>
  <text x="340" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#60A5FA" opacity="0.9">Gerilim (Volt)</text>

  <polygon points="182,308 261,193 340,193 340,308" fill="#0F2B1A" opacity="0.9"/>
  <text x="263" y="264" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="500" fill="#22C55E">I</text>
  <text x="263" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4ADE80" opacity="0.9">Akım (Amper)</text>

  <polygon points="340,193 420,193 498,308 340,308" fill="#2D1B00" opacity="0.9"/>
  <text x="420" y="264" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="500" fill="#F59E0B">R</text>
  <text x="420" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FCD34D" opacity="0.9">Direnç (Ohm)</text>

  <line x1="340" y1="193" x2="340" y2="308" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>

  <rect x="520" y="100" width="140" height="190" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="590" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748B">Formüller</text>
  <line x1="530" y1="136" x2="650" y2="136" stroke="#334155" stroke-width="0.5"/>
  <text x="590" y="162" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#F8FAFC">V = I × R</text>
  <line x1="530" y1="177" x2="650" y2="177" stroke="#1E293B" stroke-width="0.5"/>
  <text x="590" y="203" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#22C55E">I = V / R</text>
  <line x1="530" y1="218" x2="650" y2="218" stroke="#1E293B" stroke-width="0.5"/>
  <text x="590" y="244" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#F59E0B">R = V / I</text>
  <line x1="530" y1="258" x2="650" y2="258" stroke="#1E293B" stroke-width="0.5"/>
  <text x="590" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748B">P = V × I</text>

  <text x="340" y="348" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748B">Üst bölümü kapat → alttaki ikisiyle formülü bul</text>
</svg>
