<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Gece gökyüzü -->
  <rect x="5" y="5" width="90" height="90" rx="10" fill="url(#ng)"/>
  <!-- Yıldızlar -->
  <circle cx="15" cy="20" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="30" cy="15" r="1" fill="white" opacity="0.6"/>
  <circle cx="70" cy="12" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="85" cy="25" r="1" fill="white" opacity="0.6"/>
  <circle cx="80" cy="18" r="1" fill="white" opacity="0.9"/>
  <circle cx="55" cy="10" r="1" fill="white" opacity="0.7"/>
  <!-- İyonosfer katmanları -->
  <path d="M5 45 Q30 38 50 42 Q70 38 95 45" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.6" stroke-dasharray="5 3"/>
  <path d="M5 55 Q30 48 50 52 Q70 48 95 55" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.5" stroke-dasharray="5 3"/>
  <!-- Yeryüzü -->
  <path d="M5 85 Q25 75 50 78 Q75 75 95 85 L95 95 L5 95Z" fill="#22C55E" opacity="0.4"/>
  <!-- Dalga yayılması (skywave) -->
  <path d="M20 78 Q25 55 30 48 Q40 38 55 42 Q70 48 75 55 Q80 65 75 78" fill="none" stroke="url(#cg)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M20 78 Q18 68 22 60" fill="none" stroke="url(#cg)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Anten -->
  <line x1="20" y1="78" x2="20" y2="65" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="78" x2="75" y2="65" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <!-- Yansıma noktası -->
  <circle cx="52" cy="42" r="4" fill="#F59E0B" opacity="0.8"/>
</svg>
