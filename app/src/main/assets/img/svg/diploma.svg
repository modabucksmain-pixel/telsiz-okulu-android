<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
  </defs>
  <!-- Kağıt -->
  <rect x="10" y="15" width="80" height="60" rx="6" fill="#1E293B" stroke="url(#dg)" stroke-width="2"/>
  <!-- Üst şerit -->
  <rect x="10" y="15" width="80" height="10" rx="6" fill="url(#dg)" opacity="0.7"/>
  <!-- Mühür -->
  <circle cx="50" cy="52" r="14" fill="none" stroke="url(#dg)" stroke-width="2"/>
  <circle cx="50" cy="52" r="10" fill="url(#dg)" opacity="0.15"/>
  <text x="50" y="57" font-family="serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#F59E0B">★</text>
  <!-- Yazı çizgileri -->
  <line x1="25" y1="33" x2="75" y2="33" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="40" x2="70" y2="40" stroke="#475569" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Alt şerit -->
  <line x1="25" y1="70" x2="45" y2="70" stroke="url(#dg)" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="70" x2="75" y2="70" stroke="url(#dg)" stroke-width="2" stroke-linecap="round"/>
  <!-- Kurdele -->
  <path d="M40 75 L50 85 L60 75" fill="url(#dg)" opacity="0.6"/>
</svg>
