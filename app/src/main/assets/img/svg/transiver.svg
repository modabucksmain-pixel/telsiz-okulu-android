  <line x1="60" y1="45" x2="64" y2="45" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="31" x2="50" y2="35" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- İbre -->
  <line x1="50" y1="45" x2="43" y2="35" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="45" r="2.5" fill="#94A3B8"/>
  <!-- S-Meter çubuğu -->
  <rect x="22" y="57" width="56" height="5" rx="2.5" fill="#1E293B"/>
