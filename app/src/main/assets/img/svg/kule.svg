<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="rg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Röle kulesi -->
  <!-- Kule kafes yapısı -->
  <line x1="50" y1="10" x2="35" y2="80" stroke="#475569" stroke-width="2.5"/>
  <line x1="50" y1="10" x2="65" y2="80" stroke="#475569" stroke-width="2.5"/>
  <!-- Yatay destek çubukları -->
  <line x1="42" y1="25" x2="58" y2="25" stroke="#475569" stroke-width="2"/>
  <line x1="40" y1="40" x2="60" y2="40" stroke="#475569" stroke-width="2"/>
  <line x1="38" y1="55" x2="62" y2="55" stroke="#475569" stroke-width="2"/>
  <line x1="36" y1="70" x2="64" y2="70" stroke="#475569" stroke-width="2"/>
  <!-- Çapraz destekler -->
  <line x1="42" y1="25" x2="58" y2="40" stroke="#475569" stroke-width="1.5" opacity="0.6"/>
  <line x1="58" y1="25" x2="42" y2="40" stroke="#475569" stroke-width="1.5" opacity="0.6"/>
  <!-- Taban -->
  <rect x="30" y="80" width="40" height="8" rx="3" fill="#334155"/>
  <!-- Tepedeki anten -->
  <line x1="50" y1="10" x2="50" y2="0" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  <!-- Sinyal daireler -->
  <circle cx="50" cy="0" r="6" fill="none" stroke="url(#rg2)" stroke-width="2" opacity="0.8"/>
  <circle cx="50" cy="0" r="11" fill="none" stroke="url(#rg2)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="50" cy="0" r="17" fill="none" stroke="url(#rg2)" stroke-width="1" opacity="0.3"/>
  <!-- Kırmızı uyarı lambası -->
  <circle cx="50" cy="12" r="3" fill="#EF4444"/>
  <circle cx="50" cy="12" r="1.5" fill="#FBBF24"/>
