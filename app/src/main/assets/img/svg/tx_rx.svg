<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="txg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- TX/RX blok şeması -->
  <!-- TX Kutusu -->
  <rect x="5" y="30" width="35" height="25" rx="5" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="22" y="46" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#60A5FA">TX</text>
  <!-- Anten solda -->
  <line x1="22" y1="30" x2="22" y2="15" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="15" x2="10" y2="22" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="15" x2="34" y2="22" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  <!-- TX sinyal okları -->
  <path d="M40 42 L60 42" stroke="url(#txg)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M57 38 L63 42 L57 46" fill="url(#txg)"/>
  <!-- Dalga modeli -->
  <path d="M45 38 Q48 35 50 38 Q52 41 55 38" fill="none" stroke="url(#txg)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- RX Kutusu -->
  <rect x="60" y="30" width="35" height="25" rx="5" fill="#1E293B" stroke="#22C55E" stroke-width="1.5"/>
  <text x="77" y="46" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#4ADE80">RX</text>
  <!-- Anten sağda -->
  <line x1="77" y1="30" x2="77" y2="15" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="77" y1="15" x2="65" y2="22" stroke="#4ADE80" stroke-width="2" stroke-linecap="round"/>
  <line x1="77" y1="15" x2="89" y2="22" stroke="#4ADE80" stroke-width="2" stroke-linecap="round"/>
  <!-- Bilgi akışı (modülasyon) -->
  <text x="50" y="72" font-family="monospace" font-size="8" text-anchor="middle" fill="#64748B">Modülasyon</text>
  <path d="M15 75 Q18 68 22 75 Q26 82 30 75 Q34 68 38 75" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <path d="M62 75 Q65 68 69 75 Q73 82 77 75 Q81 68 85 75" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
  <text x="50" y="88" font-family="monospace" font-size="7" text-anchor="middle" fill="#475569">AM / FM / SSB</text>
</svg>
