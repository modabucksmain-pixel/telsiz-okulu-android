  <rect x="82" y="58" width="10" height="24" rx="2" fill="#EF4444" opacity="0.5"/>
  <!-- Sinyal tepe çizgisi -->
  <polyline points="10,75 17,67 27,57 38,52 46,30 52,28 58,30 70,47 77,60 87,65 95,70" fill="none" stroke="url(#wvg)" stroke-width="2.5" stroke-linecap="round"/>
