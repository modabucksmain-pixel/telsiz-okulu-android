  <rect x="12" y="65" width="10" height="17" rx="2" fill="#22C55E" opacity="0.4"/>
  <rect x="28" y="55" width="10" height="27" rx="2" fill="#3B82F6" opacity="0.5"/>
  <!-- HF tepe -->
