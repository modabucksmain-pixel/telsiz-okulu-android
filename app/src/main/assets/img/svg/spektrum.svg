  </defs>
  <!-- Frekans etiketleri -->
  <text x="15" y="92" font-family="monospace" font-size="7" fill="#64748B">LF</text>
  <text x="35" y="92" font-family="monospace" font-size="7" fill="#64748B">MF</text>
  <text x="52" y="92" font-family="monospace" font-size="7" fill="#64748B">HF</text>
  <text x="68" y="92" font-family="monospace" font-size="7" fill="#64748B">VHF</text>
  <text x="84" y="92" font-family="monospace" font-size="7" fill="#64748B">UHF</text>
  <!-- Zemin çizgisi -->
