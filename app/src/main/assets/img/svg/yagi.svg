<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94A3B8"/>
      <stop offset="100%" style="stop-color:#64748B"/>
    </linearGradient>
  </defs>
  <!-- Ana anten diplosu (dipol) -->
  <line x1="50" y1="15" x2="50" y2="85" stroke="url(#ag)" stroke-width="4" stroke-linecap="round"/>
  <!-- Sol kanatlar -->
  <line x1="50" y1="30" x2="15" y2="30" stroke="url(#ag)" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="45" x2="22" y2="45" stroke="url(#ag)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="60" x2="18" y2="60" stroke="url(#ag)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Sağ kanatlar -->
  <line x1="50" y1="30" x2="85" y2="30" stroke="url(#ag)" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="45" x2="78" y2="45" stroke="url(#ag)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="60" x2="82" y2="60" stroke="url(#ag)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Besleme noktası -->
  <circle cx="50" cy="50" r="5" fill="#3B82F6"/>
  <circle cx="50" cy="50" r="2.5" fill="white"/>
  <!-- RF sinyal çizgisi aşağı -->
  <line x1="50" y1="55" x2="50" y2="85" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 3"/>
  <!-- Taban -->
  <rect x="40" y="85" width="20" height="5" rx="2.5" fill="#334155"/>
  <!-- Yön işaretçileri -->
  <text x="8" y="33" font-family="monospace" font-size="8" fill="#60A5FA" opacity="0.7">◄</text>
  <text x="86" y="33" font-family="monospace" font-size="8" fill="#60A5FA" opacity="0.7">►</text>
</svg>
