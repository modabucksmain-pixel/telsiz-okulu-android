<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="eg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Zemin çizgisi -->
  <line x1="5" y1="82" x2="95" y2="82" stroke="#334155" stroke-width="2.5"/>
  <!-- Dikey eksen -->
  <line x1="15" y1="82" x2="15" y2="15" stroke="#334155" stroke-width="2"/>
  <!-- Sinyal eğrisi (osiloskop tarzı) -->
  <polyline points="15,50 25,50 32,20 38,80 45,50 55,50 62,25 68,75 75,50 85,50 92,50" 
            fill="none" stroke="url(#eg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ekran çerçevesi -->
  <rect x="5" y="10" width="90" height="78" rx="5" fill="none" stroke="#334155" stroke-width="2"/>
  <!-- Izgara çizgileri -->
  <line x1="15" y1="50" x2="95" y2="50" stroke="#334155" stroke-width="1" opacity="0.5" stroke-dasharray="4 3"/>
  <line x1="55" y1="10" x2="55" y2="88" stroke="#334155" stroke-width="1" opacity="0.5" stroke-dasharray="4 3"/>
  <!-- Etiket -->
  <text x="50" y="96" font-family="monospace" font-size="8" text-anchor="middle" fill="#64748B">f →</text>
</svg>
