<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Telsiz Okulu — Ana Menü</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; background: #ECE7D6; }
  body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  #root { height: 100vh; height: 100dvh; display: flex; }
  /* Fill viewport with the app, with letterboxing on wide screens */
  .app-shell { height: 100%; }
  .scroll-area::-webkit-scrollbar { width: 0; }
  .scroll-area { scrollbar-width: none; }
  button { font-family: inherit; }
  @keyframes pulse {
    0%   { transform: scale(1);   opacity: 0.7; }
    100% { transform: scale(1.8); opacity: 0; }
  }
  /* Subtle backdrop pattern outside the phone width */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(30,58,138,0.06), transparent 40%),
      radial-gradient(ellipse at 80% 100%, rgba(15,118,110,0.06), transparent 40%);
  }
  /* Grid overlay decoration for desktop letterbox */
  @media (min-width: 480px) {
    body { background:
      linear-gradient(to bottom, transparent 0, transparent calc(100% - 1px), rgba(0,0,0,0.04) 100%),
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(0,0,0,0.03) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(0,0,0,0.03) 39px 40px),
      #ECE7D6;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Data + theme (plain JS) -->
<script src="data.js"></script>
<script src="theme.js"></script>

<!-- Tweaks panel + components -->
<script type="text/babel" src="tweaks-panel.jsx"></script>

</html>
